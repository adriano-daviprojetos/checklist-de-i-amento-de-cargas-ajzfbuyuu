<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1f38" />
      <stop offset="100%" stop-color="#1e3a5f" />
    </linearGradient>
    <linearGradient id="favBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="favHook" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
  </defs>

  <!-- Background Icon Tile -->
  <rect width="64" height="64" rx="14" fill="url(#favBg)" />
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Top Crane Beam -->
  <rect x="10" y="9" width="44" height="6" rx="2" fill="url(#favBlue)" />
  <circle cx="15" cy="12" r="1.2" fill="#ffffff" />
  <circle cx="32" cy="12" r="1.2" fill="#ffffff" />
  <circle cx="49" cy="12" r="1.2" fill="#ffffff" />

  <!-- Dual Cable Lines -->
  <line x1="27" y1="15" x2="27" y2="24" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" />
  <line x1="37" y1="15" x2="37" y2="24" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" />

  <!-- Traveling Pulley Block -->
  <rect x="23" y="24" width="18" height="12" rx="3" fill="url(#favBlue)" stroke="#93c5fd" stroke-width="1" />
  <circle cx="32" cy="30" r="2.5" fill="#0f1f38" stroke="#ffffff" stroke-width="1.2" />

  <!-- Swivel -->
  <rect x="30" y="36" width="4" height="4" rx="1" fill="#ffffff" />

  <!-- Heavy Duty Crane Hook -->
  <path d="M 32 40 
           C 32 44, 33 48, 35 50 
           C 38 54, 43 55, 46 52 
           C 49 49, 48 44, 44 41 
           C 42 39, 39 39, 38 41
           C 38 41, 41 43, 42 45
           C 43 47, 42 49, 39 49
           C 35 49, 30 45, 30 40
           C 30 36, 32 34, 32 34" 
        fill="none" 
        stroke="url(#favHook)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Safety Latch -->
  <line x1="32" y1="41" x2="40" y2="46" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" />
</svg>