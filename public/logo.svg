<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 140" width="100%" height="100%">
  <defs>
    <!-- Linear Gradients for 3D Crane Effect -->
    <linearGradient id="craneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFCC00" />
      <stop offset="50%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#CC6600" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A5568" />
      <stop offset="50%" stop-color="#2D3748" />
      <stop offset="100%" stop-color="#1A202C" />
    </linearGradient>
    <linearGradient id="cableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A0AEC0" />
      <stop offset="100%" stop-color="#718096" />
    </linearGradient>
    <linearGradient id="hookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECC94B" />
      <stop offset="100%" stop-color="#D69E2E" />
    </linearGradient>
    
    <!-- Drop Shadow Filter for realism -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- ICON: Realistic Mobile Crane Boom & Hook -->
  <g transform="translate(5, 5)" filter="url(#dropShadow)">
    <!-- Outrigger / Heavy Base Plate -->
    <path d="M 15 122 L 95 122 L 90 128 L 20 128 Z" fill="#1A202C" />
    <rect x="25" y="118" width="60" height="4" fill="#E2E8F0" rx="1"/>

    <!-- Crane Chassis & Turntable Hub -->
    <path d="M 28 118 L 40 92 L 68 92 L 80 118 Z" fill="url(#metalGrad)" />
    <circle cx="54" cy="98" r="10" fill="#4A5568" stroke="#CBD5E0" stroke-width="1.5" />
    <circle cx="54" cy="98" r="4" fill="#ECC94B" />

    <!-- Telescopic Hydraulic Cylinder (Silver & Black) -->
    <line x1="50" y1="94" x2="68" y2="58" stroke="#2D3748" stroke-width="7" stroke-linecap="round" />
    <line x1="50" y1="94" x2="64" y2="65" stroke="#CBD5E0" stroke-width="4" stroke-linecap="round" />

    <!-- Main Telescopic Crane Boom (Base Section - Robust Yellow/Orange) -->
    <polygon points="44,90 78,32 90,38 56,96" fill="url(#craneGrad)" stroke="#B7791F" stroke-width="0.8"/>
    
    <!-- Boom Sections (Telescopic Extensions) -->
    <!-- Stage 2 -->
    <polygon points="76,34 98,0 107,4 85,38" fill="url(#craneGrad)" />
    <!-- Stage 3 (Upper Jib Head) -->
    <polygon points="96,2 110,-20 117,-17 103,4" fill="#ED8936" />
    
    <!-- Boom Structural Cutouts/Slots -->
    <polygon points="54,82 62,68 67,71 59,85" fill="#1A202C" opacity="0.4" />
    <polygon points="65,63 73,49 78,52 70,66" fill="#1A202C" opacity="0.4" />
    <polygon points="81,31 89,17 93,19 85,33" fill="#1A202C" opacity="0.4" />

    <!-- Boom Head Sheave / Pulley Wheel -->
    <circle cx="112" cy="-18" r="5.5" fill="#2D3748" stroke="#ECC94B" stroke-width="1.5" />
    <circle cx="112" cy="-18" r="2" fill="#FFFFFF" />

    <!-- Steel Hoist Cables (Wire Ropes) -->
    <line x1="110" y1="-13" x2="110" y2="62" stroke="url(#cableGrad)" stroke-width="1.2" stroke-dasharray="4,1" />
    <line x1="114" y1="-13" x2="114" y2="62" stroke="url(#cableGrad)" stroke-width="1.2" stroke-dasharray="4,1" />

    <!-- Snatch Block (Pulley Block with Stripes) -->
    <g transform="translate(103, 62)">
      <rect x="0" y="0" width="18" height="22" rx="3" fill="#DD6B20" stroke="#7B341E" stroke-width="1"/>
      <!-- Safety Warning Stripes -->
      <path d="M 0 4 L 4 0 L 8 0 L 0 8 Z" fill="#1A202C"/>
      <path d="M 0 12 L 12 0 L 16 0 L 0 16 Z" fill="#1A202C"/>
      <path d="M 2 22 L 18 6 L 18 10 L 6 22 Z" fill="#1A202C"/>
      <path d="M 10 22 L 18 14 L 18 18 L 14 22 Z" fill="#1A202C"/>
      <!-- Block Sheave Rivet -->
      <circle cx="9" cy="11" r="3.5" fill="#CBD5E0" stroke="#2D3748" stroke-width="1" />
      
      <!-- Swivel Heavy Duty Crane Hook -->
      <!-- Shank -->
      <rect x="7" y="22" width="4" height="5" fill="#4A5568" />
      <!-- Hook Body -->
      <path d="M 9 27 C 3 27, 0 33, 0 41 C 0 50, 8 55, 15 55 C 22 55, 25 48, 25 43 C 25 39, 21 38, 19 41 C 18 43, 16 46, 13 46 C 8 46, 6 42, 6 39 C 6 34, 9 32, 12 32 C 15 32, 16 34, 17 35 L 20 31 C 18 28, 14 27, 9 27 Z" fill="url(#hookGrad)" stroke="#744210" stroke-width="0.8"/>
      <!-- Safety Latch -->
      <line x1="8" y1="30" x2="16" y2="40" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Rigging Slings / Synthetic Strops Hanging from Hook -->
    <path d="M 116 112 L 100 128 M 116 112 L 132 128" stroke="#3182CE" stroke-width="2" stroke-linecap="round" />
    <!-- Shackles / D-Rings -->
    <circle cx="100" cy="128" r="2.5" fill="none" stroke="#CBD5E0" stroke-width="1.5" />
    <circle cx="132" cy="128" r="2.5" fill="none" stroke="#CBD5E0" stroke-width="1.5" />
  </g>

  <!-- TYPOGRAPHY / BRAND TEXT -->
  <!-- "DAVI" - Bold, Modern, Structural Navy Font -->
  <text x="148" y="68" font-family="'Montserrat', 'Arial Black', -apple-system, sans-serif" font-size="52" font-weight="900" fill="#0A192F" letter-spacing="1.5">DAVI</text>

  <!-- "PROJETOS" - Technical, Precise, Industrial Orange/Gold Font -->
  <text x="286" y="68" font-family="'Montserrat', 'Arial Black', -apple-system, sans-serif" font-size="33" font-weight="800" fill="#D97706" letter-spacing="1">PROJETOS</text>

  <!-- Modern Geometric Divider Line with Accent -->
  <rect x="150" y="80" width="285" height="3.5" fill="#0A192F" rx="1.5"/>
  <rect x="150" y="80" width="85" height="3.5" fill="#D97706" rx="1.5"/>

  <!-- SUBTITLE: "ENGENHARIA DE RIGGING & IÇAMENTO" -->
  <text x="151" y="98" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="800" fill="#475569" letter-spacing="2.8">ENGENHARIA DE RIGGING &amp; IÇAMENTO</text>

  <!-- Technical Spec Subline / Tagline -->
  <text x="151" y="114" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#64748B" letter-spacing="1.2">PLANEJAMENTO • CONSULTORIA • INSPEÇÃO</text>
</svg>
