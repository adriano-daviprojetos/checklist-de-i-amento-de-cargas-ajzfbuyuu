<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 130" width="100%" height="100%">
  <defs>
    <linearGradient id="daviNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192c" />
      <stop offset="100%" stop-color="#1e3e62" />
    </linearGradient>
    <linearGradient id="daviRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e63946" />
      <stop offset="100%" stop-color="#c1121f" />
    </linearGradient>
    <linearGradient id="daviGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="hookSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="shadowGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Brand Emblem (Left) -->
  <g transform="translate(15, 10)" filter="url(#shadowGlow)">
    <!-- Hexagonal / Shield Geometric Base -->
    <path d="M 55 5 L 98 28 L 98 82 L 55 105 L 12 82 L 12 28 Z" fill="url(#daviNavyGrad)" stroke="#38bdf8" stroke-width="2.5" />
    
    <!-- Top Crane Boom Graphic Accent -->
    <path d="M 28 32 L 82 32 L 75 42 L 35 42 Z" fill="url(#daviRedGrad)" />
    
    <!-- Crane Boom Lattice Truss Lines -->
    <line x1="40" y1="32" x2="48" y2="42" stroke="#ffffff" stroke-width="1.5" />
    <line x1="55" y1="32" x2="63" y2="42" stroke="#ffffff" stroke-width="1.5" />
    <line x1="70" y1="32" x2="75" y2="42" stroke="#ffffff" stroke-width="1.5" />

    <!-- Hoist Wire Rope -->
    <line x1="55" y1="42" x2="55" y2="58" stroke="#94a3b8" stroke-width="2.5" />

    <!-- Rigging Hook -->
    <circle cx="55" cy="62" r="3.5" fill="#ffffff" />
    <path d="M 55 64 
             C 55 70, 56 75, 59 78 
             C 62 82, 69 84, 73 80 
             C 76 77, 75 70, 68 66 
             C 65 64, 61 64, 60 67
             C 60 67, 64 69, 65 71
             C 66 73, 65 76, 62 76
             C 57 76, 50 71, 50 63
             C 50 58, 55 55, 55 55" 
          fill="none" 
          stroke="url(#hookSteel)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <!-- Safety Latch in Gold -->
    <line x1="54" y1="65" x2="65" y2="72" stroke="url(#daviGoldGrad)" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Typography: DAVI PROJETOS DE RIGGING -->
  <g transform="translate(135, 12)">
    <!-- DAVI -->
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="2" fill="#ffffff">
      DAVI
    </text>

    <!-- PROJETOS -->
    <text x="132" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="2" fill="#e63946">
      PROJETOS
    </text>

    <!-- Dynamic Graphic Slash & Underline -->
    <rect x="0" y="56" width="370" height="3.5" rx="1.75" fill="url(#daviGoldGrad)" />
    <circle cx="370" cy="57.75" r="3.5" fill="#e63946" />

    <!-- DE RIGGING SUBHEADER -->
    <g transform="translate(0, 72)">
      <!-- Badge-style container for RIGGING -->
      <rect x="0" y="0" width="150" height="24" rx="5" fill="#1e3e62" stroke="#38bdf8" stroke-width="1" />
      <text x="75" y="16.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="800" letter-spacing="3" fill="#ffffff" text-anchor="middle">
        DE RIGGING
      </text>

      <!-- Engineering & Safety Subtext -->
      <text x="162" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#94a3b8">
        ENGENHARIA &amp; IÇAMENTO
      </text>
    </g>

    <!-- Standards descriptor -->
    <g transform="translate(0, 102)">
      <circle cx="4" cy="4" r="3" fill="#10b981" />
      <text x="13" y="7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.8" fill="#64748b">
        PLANOS DE RIGGING • NR-11 • NR-12 • INSPEÇÃO DE ACESSÓRIOS
      </text>
    </g>
  </g>
</svg>